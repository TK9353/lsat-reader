name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Check content sources
        if: always()
        run: bash tools/check_feeds.sh > feeds.log 2>&1 || true

      - name: Publish status to ci-status branch
        if: always()
        run: |
          mkdir -p /tmp/status
          cp build.log feeds.log /tmp/status/ 2>/dev/null || true
          echo "run=${{ github.run_number }} sha=${{ github.sha }} build=${{ steps.build.outcome }}" > /tmp/status/result.txt
          (grep -nE "^e: |error:|FAILURE|What went wrong|Could not" -A4 build.log | head -300) > /tmp/status/errors.txt || true
          cd /tmp/status
          git init -q -b ci-status
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add -A
          git commit -qm "status run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-status

      - name: Rename APK
        if: steps.build.outcome == 'success'
        run: cp app/build/outputs/apk/debug/app-debug.apk "LSAT-Reader-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: LSAT-Reader-apk
          path: LSAT-Reader-*.apk

      - name: Release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LSAT Reader v1.0.${{ github.run_number }}
          body: "휴대폰에서 아래 APK를 내려받아 설치하세요."
          files: LSAT-Reader-*.apk
          make_latest: true
